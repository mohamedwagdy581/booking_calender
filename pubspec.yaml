
name: booking
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UI
  flutter_screenutil: ^5.9.3
  equatable: ^3.0.0
  # State Management
  flutter_bloc: ^9.1.1
  # Routing
  go_router: ^18.1.1
  # Service Locator
  get_it: ^9.3.0
  # Calendar
  table_calendar: ^3.1.2
  intl: ^0.20.3
  # Supabase
  supabase_flutter: ^2.5.5
  # PDF
  pdf: ^3.11.0
  printing: ^5.11.0
  open_filex: ^5.0.0
  file_saver: ^0.7.0
  hijri: ^3.0.0
  logger: ^2.6.2
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.3.2
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_main.png"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/notosans/NotoSansArabic-Regular.ttf
    - assets/fonts/notosans/NotoSansArabic-Bold.ttf
    - assets/fonts/diin/
    - assets/config/public.env
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/notosans/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/notosans/NotoSansArabic-Bold.ttf
          weight: 700 

    - family: DINNextLTArabic
      fonts:
        - asset: assets/fonts/diin/DINNextLTArabic-Regular-2.ttf
          weight: 400
